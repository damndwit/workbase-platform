# Hosting config. Render settings override this on the live service.
services:
  - type: web
    name: workbase-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: public_demo
      - key: PUBLIC_DEMO_MODE
        value: "1"
