services:
  - type: web
    name: workbase-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_DEMO_MODE
        value: "1"
      - key: WORKBASE_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
