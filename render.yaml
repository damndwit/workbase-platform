services:
  - type: web
    name: workbase-demo
    runtime: python
    plan: free
    buildCommand: bash scripts/build-render.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_DEMO_MODE
        value: "1"
      - key: WORKBASE_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
