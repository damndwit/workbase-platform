# Deployment settings for the live Workbase ticketing app.
services:
  - type: web
    name: workbaseticket
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_DEMO_MODE
        value: "0"
      - key: WORKBASE_GUEST_PREVIEW
        value: "1"
      - key: WORKBASE_PUBLIC_URL
        value: https://workbaseticket.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: WORKBASE_SIGNUP_CODE
        sync: false
      - key: WORKBASE_SECRET_KEY
        generateValue: true
